dataloader:
  batch_size: 128
  params:
    padding: 1
    past_k: 0
    path: ./data/etth2.csv
    test: 0.2
    train: 0.7
    window: 96
  shuffle: true
  target: training.dataset.TimeSeriesDataset
model:
  denoiser:
    params:
      kaiser_beta: 14.77
      kaiser_size: 64
      seq_len: 96
      sigma_from_t: false
    target: models.networks.LinearNet
  noise_schedule:
    params:
      ema_beta: 0.99
      scale_from_data: true
      scale_max: 1.737187604915809
      scale_min: 0.47167081726659
      sigma_data: 1.0
      sliding_window: 60
      stats: cumulative
      var_max: 6.37510243777871
      var_min: 9.82819947693054e-06
    target: models.noise.TEDM
  preconditioning:
    target: models.precond.TEDM
sampler:
  params:
    backward: true
    batch_size: 128
    clamp: true
    deterministic: true
    horizon: 96
    n_tracks: 300
  target: training.sampler.TEDM
trainer:
  ema:
    decay: 0.995
    update_interval: 10
  gradient_accumulate_every: 1
  logger:
    params:
      args: None
      enable: true
      env_name: TEDM
      log_freq: 10
      port: 8097
      print_to_console: false
      server: localhost
      verbose: false
    target: training.logger.BaseLogger
  max_epochs: 1910
  optimizer:
    params:
      betas:
      - 0.8880368963100577
      - 0.9598951878407503
      lr: 2.1774972378718916e-06
      weight_decay: 0.0
    target: torch.optim.Adam
  scheduler:
    params:
      factor: 0.36148677669945994
      min_lr: 1.0e-06
      patience: 10
      threshold: 0.01
      threshold_mode: rel
      verbose: false
      warmup: 374
      warmup_lr: 0.002382332997993948
    target: training.scheduler.ReduceLROnPlateauWithWarmup
  validation_check: false
  validation_viz: false
